name: Scanner regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy Pillow
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_nodes rapidgen_handler.py workflow_guard.py safety_outcome.py
